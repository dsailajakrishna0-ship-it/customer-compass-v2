[project]
name = "customer-compass-api-py"
version = "0.1.0"
description = "Customer Compass API (Python/FastAPI) — v2 stack migration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "qdrant-client>=1.19.1",
    "python-frontmatter>=1.3.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false
